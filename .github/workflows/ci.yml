name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install
      - name: Build
        run: bun tools/build.mjs --offline
      - name: Check every scene
        # Shared runners are roughly 1.5x slower than a desktop; the 5 ms desktop budget becomes 8 ms here.
        env:
          VM_BUDGET_MS: "8"
        run: bun tools/check-all.mjs
      - name: Evaluate the song mapper
        run: bun tools/eval-mapper.mjs
      - name: Approved tests (Node)
        # Scene contract tests run the engine checker; shared runners are slower, as with VM_BUDGET_MS above.
        env:
          VM_BUDGET_MS: "8"
          FLOURISH_AVG_MS: "6"
        run: |
          shopt -s nullglob
          files=(tools/test/*.test.mjs)
          if [ ${#files[@]} -gt 0 ]; then node --test "${files[@]}"; else echo "no Node tests yet"; fi
      - name: Approved tests (Python)
        run: |
          shopt -s nullglob
          files=(tools/test/test_*.py)
          if [ ${#files[@]} -gt 0 ]; then
            pip install numpy scipy
            python3 -m unittest discover -s tools/test -p 'test_*.py' -v
          else echo "no Python tests yet"; fi

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install && bun tools/build.mjs
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Smoke test
        run: python3 tools/e2e/smoke.py
